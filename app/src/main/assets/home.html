<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Nova Browser</title>
<style>
:root{color-scheme:dark;font-family:Inter,Roboto,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#050608;color:#f5f5f7}
body{min-height:100vh;display:grid;place-items:center;overflow-x:hidden}
.wallpaper{position:fixed;inset:0;background-color:#050608;background-image:linear-gradient(90deg,rgba(0,0,0,.68),rgba(0,0,0,.28) 55%,rgba(0,0,0,.68)),linear-gradient(0deg,rgba(0,0,0,.72),transparent 65%),url("https://www.kali.org/images/kali-dragon-icon.svg");background-size:min(78vw,620px);background-position:center 44%;background-repeat:no-repeat;filter:brightness(.82);z-index:0}
main{position:relative;z-index:1;width:min(680px,92vw);padding:32px 20px;text-align:center;margin:auto}
.brand{font-size:clamp(32px,8vw,54px);font-weight:750;letter-spacing:-2px;margin:0 0 8px;text-shadow:0 3px 22px #000}
.sub{margin:0 0 30px;color:#d4d4d8;font-size:14px;text-shadow:0 2px 10px #000}
.search{display:flex;align-items:center;gap:7px;padding:7px;background:rgba(15,17,21,.88);border:1px solid rgba(255,255,255,.17);border-radius:18px;box-shadow:0 12px 38px #0008;backdrop-filter:blur(14px)}
.engine{max-width:124px;min-width:0;border:1px solid #ffffff20;border-radius:12px;background:#242830;color:#fff;padding:10px 8px;font-size:12px;outline:none}
.engine:focus{border-color:#58a6e7}
@media(max-width:420px){.search{gap:5px;padding:6px}.engine{max-width:104px;padding:10px 5px;font-size:11px}input{padding:11px 7px;font-size:14px}button{padding:0 12px}}
input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#fff;padding:12px 14px;font-size:16px}
button{border:0;border-radius:13px;padding:0 19px;background:#1769aa;color:#fff;font-weight:650;font-size:14px}
.shortcuts{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:25px}
a{color:#fff;text-decoration:none}
.shortcut{min-width:88px;padding:13px 15px;border:1px solid #ffffff24;border-radius:14px;background:#101318b8;backdrop-filter:blur(12px);font-size:13px}
.shortcut:active,button:active{transform:scale(.97)}
.shortcuts[hidden]{display:none!important}
.footer{margin-top:30px;color:#c5c5cb;font-size:11px;text-shadow:0 2px 8px #000}
@media(prefers-reduced-motion:no-preference){.wallpaper{animation:fadein .8s ease-out}@keyframes fadein{from{opacity:.4}to{opacity:1}}}
</style>
</head>
<body>
<div class="wallpaper" aria-hidden="true"></div>
<main>
<h1 class="brand">Nova Browser</h1>
<p class="sub">A faster way to explore.</p>
<form class="search" id="searchForm">
<input id="query" type="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Search the web or enter an address" aria-label="Search the web">
<button type="submit">Search</button>
</form>
<nav class="shortcuts" id="shortcuts" aria-label="Quick links">
<a class="shortcut" href="https://www.google.com">Google</a>
<a class="shortcut" href="https://www.youtube.com">YouTube</a>
<a class="shortcut" href="https://www.perplexity.ai">Perplexity</a>
<a class="shortcut" href="https://github.com">GitHub</a>
</nav>
<p class="footer">Your browsing stays on your device unless you choose to use an online service.</p>
</main>
<script>
if(new URLSearchParams(location.search).get("hideShortcuts")==="1")document.getElementById("shortcuts").hidden=true;
document.getElementById("searchForm").addEventListener("submit",function(event){
 event.preventDefault();
 const value=document.getElementById("query").value.trim();
 if(!value)return;
 const looksLikeUrl=/^(https?:\/\/)/i.test(value)||(/^[^\s.]+\.[^\s]+$/.test(value)&&!value.includes(" "));
 window.location.href=looksLikeUrl?(value.match(/^https?:\/\//i)?value:"https://"+value):"https://www.google.com/search?q="+encodeURIComponent(value);
});
</script>
</body>
</html>
