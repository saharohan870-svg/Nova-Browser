name: Zorvi Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build and test
        run: gradle testDebugUnitTest assembleDebug --stacktrace
      - name: Validate ARM64 APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*arm64-v8a*debug.apk' -print -quit)
          test -n "$APK"
          test -f "$APK"
          SIZE=$(stat -c%s "$APK")
          test "$SIZE" -lt 400000000
          echo "path=$APK" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Zorvi Browser ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ steps.apk.outputs.path }}
