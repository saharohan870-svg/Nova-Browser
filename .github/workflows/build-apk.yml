name: Nova Browser APK build

on:
  workflow_dispatch:
  push:
    branches: [ chromium-engine-migration ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradle.properties'
      - '*.gradle*'
      - 'settings.gradle*'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Verify APK
        run: |
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name "*.apk" -print -quit)
          test -n "$APK"
          echo "Built APK: $APK"
          ls -lh "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: nova-browser-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
