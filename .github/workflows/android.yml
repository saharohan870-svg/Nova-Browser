name: Nova Browser Phase 4 Validation

on:
  push:
    branches: [ main, chromium-engine-migration ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradle.properties'
      - '*.gradle*'
      - 'settings.gradle*'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install required Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Run Zorvi engine unit tests
        run: gradle testDebugUnitTest --stacktrace
      - name: Compile debug APK
        run: gradle assembleDebug --stacktrace
      - name: Check APK download size
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "APK bytes: $SIZE"
          test "$SIZE" -lt 100000000
      - uses: actions/upload-artifact@v4
        with:
          name: nova-browser-phase4-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
