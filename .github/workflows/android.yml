name: Nova Browser CI validation

on:
  push:
    branches: [ main, chromium-engine-migration ]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'gradle/**'
      - 'gradle.properties'
      - '*.gradle*'
      - 'settings.gradle*'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install required Android SDK packages
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
      - name: Run repeated Nova regression checks (20 passes)
        shell: bash
        run: |
          set -euo pipefail
          for pass in $(seq 1 20); do
            echo "===== Regression pass $pass/20: ad blocker ====="
            node tests/adblock-engine.test.cjs
            echo "===== Regression pass $pass/20: Android unit tests ====="
            gradle testDebugUnitTest --stacktrace
          done
      - name: Compile debug APK
        run: gradle assembleDebug --stacktrace
      - name: Check APK download size
        run: |
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name "*.apk" -print -quit)
          test -n "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "APK: $APK"
          echo "APK bytes: $SIZE"
          test "$SIZE" -lt 300000000
      - uses: actions/upload-artifact@v4
        with:
          name: nova-browser-arm64-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
