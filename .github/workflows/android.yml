name: Zorvi GeckoView Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - zorvi-brave-migration
    paths:
      - 'app/**'
      - 'settings.gradle.kts'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'settings.gradle.kts'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install required Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build and test debug APK
        run: gradle testDebugUnitTest assembleDebug --stacktrace
      - name: Check APK download size
        run: |
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*arm64-v8a*debug.apk' -print -quit)
          test -n "$APK"
          test -f "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "ARM64 APK: $APK"
          echo "APK bytes: $SIZE"
          test "$SIZE" -lt 400000000
      - uses: actions/upload-artifact@v4
        with:
          name: zorvi-geckoview-arm64-debug
          path: app/build/outputs/apk/debug/*arm64-v8a*debug.apk
          if-no-files-found: error
